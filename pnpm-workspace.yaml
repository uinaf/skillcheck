allowBuilds:
  esbuild: true
  "@swc/core": true
  protobufjs: true
  "@playwright/browser-chromium": false
  onnxruntime-node: false
  sharp: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
ignoredOptionalDependencies:
  # promptfoo security-scan path; skillcheck never runs it. Its extract-zip has no patch for
  # GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3. Drop once a patched extract-zip ships.
  - "@openai/codex-security"
  # promptfoo optional JKS path; node-forge has no patched release for GHSA-86w9-cpqp-85rv yet.
  - jks-js
overrides:
  # Local-model inference is unused; its ONNX chain carries GHSA-hp3w-g68c-fv3c.
  "promptfoo>@huggingface/transformers": "-"
  "fast-uri@<3.1.8": "^3.1.8" # GHSA-hrr3-gc8f-f4qj
  "ip-address@<10.7.1": "^10.7.1" # GHSA-j6r3-76f7-8jcv, GHSA-h3mg-xc3c-68pw
  "qs@<6.16.0": "^6.16.0" # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g
  "@modelcontextprotocol/sdk@<1.31.0": "^1.31.0" # GHSA-6qxp-vccf-f47h
  "proxy-addr@<2.0.8": "^2.0.8" # GHSA-jqcg-44mw-7w3h
  "source-map-js@<1.2.2": "^1.2.2" # GHSA-68fv-2mgg-jv7q
  "adm-zip@<0.6.1": "^0.6.1" # GHSA-xcpc-8h2w-3j85, GHSA-vwc7-r8mq-g2x9
  "sharp@<0.35.4": "^0.35.4" # GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c
  "axios@<1.20.0": "^1.20.0" # GHSA-c29m-xwm3-cm6r, GHSA-mghh-pgcx-3jjj
  "basic-ftp@<6.2.1": "^6.2.1" # GHSA-c475-qrg2-pj4r
  "zod@<4.6.6": "^4.6.6" # GHSA-mrhx-c7xc-m3w5
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0" # GHSA-27r3-jxmh-p828
  # @azure/identity still allows 5.x and 6.x, which have no patch.
  "@azure/msal-node@<7.1.0": "^7.1.0" # GHSA-xcx6-jx8p-x3h5
  "undici@>=6.23.0 <6.29.1": "^6.29.1" # GHSA-xjj6-f33q-929c
  "undici@>=7.18.0 <7.30.1": "^7.30.1" # GHSA-xjj6-f33q-929c
  "undici@>=8.0.0 <8.12.2": "^8.12.2" # GHSA-xjj6-f33q-929c
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
