allowBuilds:
  esbuild: true
  "@swc/core": true
  protobufjs: true
  "@playwright/browser-chromium": false
  onnxruntime-node: false
  sharp: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
ignoredOptionalDependencies:
  # promptfoo security-scan path; skillcheck never runs it. Its extract-zip has no patch for
  # GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3. Drop once a patched extract-zip ships.
  - "@openai/codex-security"
  # promptfoo optional JKS path; node-forge has no patched release for GHSA-86w9-cpqp-85rv yet.
  - jks-js
overrides:
  "adm-zip@<0.6.1": "^0.6.1" # GHSA-xcpc-8h2w-3j85, GHSA-vwc7-r8mq-g2x9
  "sharp@<0.35.4": "^0.35.4" # GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c
  "axios@<1.20.0": "^1.20.0" # GHSA-c29m-xwm3-cm6r, GHSA-mghh-pgcx-3jjj
  "basic-ftp@<6.2.1": "^6.2.1" # GHSA-c475-qrg2-pj4r
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
