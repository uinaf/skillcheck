name: Release

# The file name is load-bearing. npm Trusted Publishing binds this package's
# OIDC identity to `.github/workflows/release.yml` plus the `release`
# environment. Rename or move this file and `npm publish` fails with an identity
# mismatch until someone updates the trusted publisher on npmjs.com. So the
# publish job stays here, and anything else that runs on a push to main comes
# to it rather than the other way round.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # One verify and one secret scan, called from their own files so a pull
  # request, the merge queue, and this push all run the same definition.
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: uinaf/.github/.github/workflows/scan.yml@main

  # A skipped dependency skips its dependents, so `[skip ci]` is declared once
  # above and reaches this job through `needs`. The version writeback carries
  # that marker, which is what stops a release from releasing itself.
  release:
    needs: [verify, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      deployment: false
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # semantic-release reads the whole tag history to pick the next
          # version. v0.1.3 is the floor it continues from.
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          standalone: true
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          # This job holds publish credentials. It never reads a cache a pull
          # request could have written.
          cache: false
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Authorize release writes
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: gh auth setup-git
      - id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/npm@13.1.5
            @jno21/semantic-release-github-commit@1.0.1
            @semantic-release/github@12.0.8
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}

      - name: Verify immutable release
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .immutable)" = true
